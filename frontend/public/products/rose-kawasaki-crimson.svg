<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- outer petals -->
  <polygon points="200,100 250,170 200,190" fill="#a6344b" opacity="0.7"/>
  <polygon points="200,100 150,170 200,190" fill="#c44a62" opacity="0.7"/>
  <polygon points="250,170 280,250 200,210" fill="#8a2a3b" opacity="0.7"/>
  <polygon points="150,170 120,250 200,210" fill="#a6344b" opacity="0.7"/>
  <polygon points="280,250 200,300 200,210" fill="#a6344b" opacity="0.6"/>
  <polygon points="120,250 200,300 200,210" fill="#8a2a3b" opacity="0.6"/>
  <!-- spiral center -->
  <path d="M200,180 Q215,175 210,195 Q205,210 190,205 Q175,200 180,185 Q185,170 200,175" fill="none" stroke="#c44a62" stroke-width="2" opacity="0.8"/>
  <path d="M200,185 Q210,182 207,197 Q204,207 193,204 Q183,201 186,190 Q189,180 200,183" fill="none" stroke="#c44a62" stroke-width="1.5" opacity="0.6"/>
  <!-- center -->
  <circle cx="200" cy="192" r="5" fill="#c44a62" opacity="0.8"/>
  <!-- petal edges -->
  <line x1="200" y1="100" x2="250" y2="170" stroke="#8a2a3b" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="100" x2="150" y2="170" stroke="#a6344b" stroke-width="0.5" opacity="0.4"/>
  <!-- stem hint -->
  <line x1="200" y1="300" x2="200" y2="340" stroke="#6a8a5a" stroke-width="2"/>
</svg>