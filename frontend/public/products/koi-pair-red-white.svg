<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- red koi (top) -->
  <polygon points="120,160 180,140 220,160 180,180" fill="#a6344b" stroke="#c44a62" stroke-width="0.8"/>
  <polygon points="120,160 140,140 180,140 180,180" fill="#c44a62" opacity="0.8"/>
  <polygon points="180,140 220,160 180,180" fill="#8a2a3b" opacity="0.8"/>
  <!-- tail -->
  <polygon points="120,160 90,140 100,170" fill="#a6344b" opacity="0.8"/>
  <polygon points="120,160 100,170 90,190" fill="#c44a62" opacity="0.7"/>
  <!-- head detail -->
  <circle cx="210" cy="158" r="3" fill="#2a1520"/>
  <!-- white koi (bottom, offset right) -->
  <polygon points="200,220 260,200 300,220 260,240" fill="#fbfaf7" stroke="#e0ddd5" stroke-width="0.8"/>
  <polygon points="200,220 220,200 260,200 260,240" fill="#efede6" opacity="0.8"/>
  <polygon points="260,200 300,220 260,240" fill="#e0ddd5" opacity="0.8"/>
  <!-- tail -->
  <polygon points="200,220 170,200 180,230" fill="#fbfaf7" opacity="0.8"/>
  <polygon points="200,220 180,230 170,250" fill="#efede6" opacity="0.7"/>
  <!-- head detail -->
  <circle cx="290" cy="218" r="3" fill="#2a1520"/>
  <!-- water ripple -->
  <ellipse cx="200" cy="200" rx="120" ry="80" fill="none" stroke="#4a6a8b" stroke-width="0.5" opacity="0.2"/>
</svg>