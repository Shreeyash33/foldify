<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- outer box (largest) -->
  <polygon points="100,180 200,140 300,180 300,280 200,320 100,280" fill="#cbae8b" stroke="#a98a64" stroke-width="1"/>
  <polygon points="100,180 200,140 200,240 100,280" fill="#a98a64" opacity="0.5"/>
  <polygon points="200,140 300,180 300,280 200,240" fill="#b89a70" opacity="0.5"/>
  <!-- middle box (visible inside) -->
  <polygon points="130,195 200,165 270,195 270,265 200,295 130,265" fill="#efede6" stroke="#e0ddd5" stroke-width="0.8"/>
  <polygon points="130,195 200,165 200,235 130,265" fill="#e0ddd5" opacity="0.5"/>
  <polygon points="200,165 270,195 270,265 200,235" fill="#fbfaf7" opacity="0.5"/>
  <!-- smallest box (visible inside middle) -->
  <polygon points="155,210 200,190 245,210 245,250 200,270 155,250" fill="#fbfaf7" stroke="#e0ddd5" stroke-width="0.6"/>
  <polygon points="155,210 200,190 200,230 155,250" fill="#e0ddd5" opacity="0.4"/>
  <polygon points="200,190 245,210 245,250 200,230" fill="#efede6" opacity="0.4"/>
  <!-- lid (hovering above) -->
  <polygon points="90,140 200,100 310,140 200,175" fill="#cbae8b" stroke="#a98a64" stroke-width="0.8" opacity="0.7"/>
  <polygon points="90,140 200,100 200,155 90,175" fill="#a98a64" opacity="0.3"/>
  <polygon points="200,100 310,140 200,175" fill="#b89a70" opacity="0.3"/>
</svg>