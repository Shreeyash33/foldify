<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- outer rim -->
  <polygon points="200,60 296,99 340,200 296,301 200,340 104,301 60,200 104,99" fill="#6a9aa8" stroke="#4a7a8a" stroke-width="1"/>
  <!-- bowl wall -->
  <polygon points="200,100 280,130 320,200 280,270 200,300 120,270 80,200 120,130" fill="#4a7a8a" stroke="#3a6a7a" stroke-width="1"/>
  <!-- inner facets -->
  <polygon points="200,100 280,130 200,200 120,130" fill="#5a8a9a" opacity="0.5"/>
  <polygon points="280,130 320,200 200,200" fill="#3a6a7a" opacity="0.5"/>
  <polygon points="320,200 280,270 200,200" fill="#5a8a9a" opacity="0.4"/>
  <polygon points="280,270 200,300 200,200" fill="#3a6a7a" opacity="0.5"/>
  <polygon points="200,300 120,270 200,200" fill="#5a8a9a" opacity="0.4"/>
  <polygon points="120,270 80,200 200,200" fill="#3a6a7a" opacity="0.5"/>
  <polygon points="80,200 120,130 200,200" fill="#5a8a9a" opacity="0.4"/>
  <polygon points="120,130 200,100 200,200" fill="#4a7a8a" opacity="0.5"/>
  <!-- twisted centre (pinwheel) -->
  <polygon points="200,200 228,172 200,148 172,172" fill="#2a5a6a" stroke="#1a4a5a" stroke-width="0.8"/>
  <polygon points="200,200 228,228 200,252 172,228" fill="#1a4a5a" stroke="#0a3a4a" stroke-width="0.8"/>
  <polygon points="200,200 252,228 228,200 252,172" fill="#2a5a6a" stroke="#1a4a5a" stroke-width="0.8"/>
  <polygon points="200,200 148,228 172,200 148,172" fill="#1a4a5a" stroke="#0a3a4a" stroke-width="0.8"/>
  <!-- twist creases -->
  <line x1="200" y1="60" x2="200" y2="148" stroke="#3a6a7a" stroke-width="0.6" opacity="0.5"/>
  <line x1="200" y1="252" x2="200" y2="340" stroke="#3a6a7a" stroke-width="0.6" opacity="0.5"/>
  <line x1="60" y1="200" x2="172" y2="200" stroke="#3a6a7a" stroke-width="0.6" opacity="0.5"/>
  <line x1="228" y1="200" x2="340" y2="200" stroke="#3a6a7a" stroke-width="0.6" opacity="0.5"/>
</svg>