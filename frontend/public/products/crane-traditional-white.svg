<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- body -->
  <polygon points="200,100 280,220 200,190" fill="#fbfaf7" stroke="#e0ddd5" stroke-width="1"/>
  <polygon points="200,100 120,220 200,190" fill="#efede6" stroke="#e0ddd5" stroke-width="1"/>
  <!-- wings -->
  <polygon points="200,190 300,160 280,220" fill="#efede6" stroke="#e0ddd5" stroke-width="1"/>
  <polygon points="200,190 100,160 120,220" fill="#e0ddd5" stroke="#e0ddd5" stroke-width="1"/>
  <!-- wing fold highlight -->
  <polygon points="200,190 260,155 300,160" fill="#fbfaf7" opacity="0.6"/>
  <polygon points="200,190 140,155 100,160" fill="#efede6" opacity="0.6"/>
  <!-- tail -->
  <polygon points="200,190 195,280 205,280" fill="#efede6" stroke="#e0ddd5" stroke-width="1"/>
  <!-- head/neck -->
  <polygon points="200,190 200,80 215,80 210,190" fill="#fbfaf7" stroke="#e0ddd5" stroke-width="1"/>
  <!-- head -->
  <polygon points="200,80 215,80 210,60" fill="#efede6" stroke="#e0ddd5" stroke-width="1"/>
  <polygon points="215,80 210,60 225,55" fill="#e0ddd5" stroke="#e0ddd5" stroke-width="1"/>
  <!-- fold line accents -->
  <line x1="200" y1="100" x2="200" y2="190" stroke="#e0ddd5" stroke-width="0.5" opacity="0.5"/>
  <line x1="200" y1="190" x2="300" y2="160" stroke="#e0ddd5" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="190" x2="100" y2="160" stroke="#e0ddd5" stroke-width="0.5" opacity="0.3"/>
</svg>