<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efede6"/>
      <stop offset="100%" stop-color="#d3d8dd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- tail -->
  <polygon points="150,185 95,168 90,195 130,205" fill="#6e7b8a" opacity="0.8"/>
  <polygon points="150,185 95,195 130,205" fill="#5a6b7a" opacity="0.6"/>
  <!-- body -->
  <polygon points="140,195 205,165 265,175 288,215 260,240 175,240 138,218" fill="#8a95a3" stroke="#6e7b8a" stroke-width="1"/>
  <polygon points="175,240 205,165 265,175 260,240" fill="#aab3bd" opacity="0.5"/>
  <!-- breast -->
  <polygon points="170,240 230,240 240,215 205,180 170,205" fill="#fbfaf7" stroke="#e0ddd5" stroke-width="0.8"/>
  <!-- wing -->
  <polygon points="175,185 235,180 258,218 215,238 172,215" fill="#6e7b8a" stroke="#5a6b7a" stroke-width="0.8"/>
  <polygon points="175,185 235,180 215,208 172,210" fill="#8a95a3" opacity="0.5"/>
  <!-- head -->
  <polygon points="265,175 292,150 315,170 298,200 272,202" fill="#8a95a3" stroke="#6e7b8a" stroke-width="1"/>
  <circle cx="272" cy="202" r="14" fill="#8a95a3"/>
  <!-- head cap -->
  <polygon points="265,175 285,152 305,165 292,150" fill="#aab3bd" opacity="0.6"/>
  <!-- beak -->
  <polygon points="315,170 336,176 312,184" fill="#d9a24a" stroke="#c98f35" stroke-width="0.6"/>
  <!-- eye -->
  <circle cx="298" cy="170" r="2.5" fill="#2a3542"/>
  <!-- feet -->
  <line x1="185" y1="240" x2="180" y2="258" stroke="#c98f35" stroke-width="2"/>
  <line x1="180" y1="258" x2="172" y2="264" stroke="#c98f35" stroke-width="1.5"/>
  <line x1="180" y1="258" x2="184" y2="266" stroke="#c98f35" stroke-width="1.5"/>
  <line x1="215" y1="240" x2="217" y2="258" stroke="#c98f35" stroke-width="2"/>
  <line x1="217" y1="258" x2="208" y2="264" stroke="#c98f35" stroke-width="1.5"/>
  <line x1="217" y1="258" x2="222" y2="266" stroke="#c98f35" stroke-width="1.5"/>
</svg>